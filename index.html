<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои фильмы</title>
<style>
:root{--bg:#12151e;--paper:#efe6d2;--ink:#1c1a17;--mut:#8a8470;--amber:#f0a830;--line:#2b3040;--tx:#e9e4d6}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}
h1{font-size:2rem;font-style:italic}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
button,select,input{font:inherit;border-radius:6px;border:1px solid var(--line);background:#1b2030;color:var(--tx);padding:8px 12px}
button{cursor:pointer}
button:hover{border-color:var(--amber)}
button.main{background:var(--amber);color:#1c1a17;border-color:var(--amber);font-weight:600}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{display:flex;background:var(--paper);color:var(--ink);border-radius:8px;overflow:hidden}
.card img,.noimg{width:92px;min-height:138px;object-fit:cover;background:#cfc4a8;flex:none}
.body{flex:1;padding:10px 12px;border-left:2px dashed #b9ad8f;display:flex;flex-direction:column;gap:4px}
.body h2{font-size:1.05rem;line-height:1.2}
.meta{color:#6b6551;font-size:.82rem}
.note{font-size:.85rem;font-style:italic}
.my{font-family:Georgia,serif;font-size:1.3rem;color:#a2611a}
.acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.card button{background:transparent;color:var(--ink);border-color:#b9ad8f;padding:4px 9px;font-size:.85rem}
.card button:hover{border-color:var(--ink)}
.empty{color:var(--mut);padding:30px 0}
#auth{max-width:340px;margin:12vh auto;display:grid;gap:10px}
#auth input,#auth button{width:100%}
#msg{color:var(--amber);min-height:1.2em;font-size:.9rem}
#pick{background:var(--paper);color:var(--ink);border-radius:8px;padding:12px 14px;margin-bottom:16px}
#pick h2{font-size:1.2rem}
footer{margin-top:40px;color:var(--mut);font-size:.78rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>

<section id="auth" hidden>
  <h1>Мои фильмы</h1>
  <input id="em" type="email" placeholder="Эл. почта" autocomplete="email">
  <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <button class="main" onclick="authGo('in')">Войти</button>
  <button onclick="authGo('up')">Зарегистрироваться</button>
  <div id="msg"></div>
</section>

<section id="app" hidden>
  <header>
    <h1>Мои фильмы</h1>
    <button onclick="sb.auth.signOut()">Выйти</button>
  </header>
  <div class="tabs" id="tabs">
    <button data-t="watchlist" class="on">Хочу посмотреть</button>
    <button data-t="watched">Просмотрено</button>
    <button data-t="search">Найти фильм</button>
  </div>

  <div id="listView">
    <div class="bar">
      <select id="fg"></select>
      <select id="fr">
        <option value="">Любая длительность</option>
        <option value="95">до 95 минут</option>
        <option value="125">до 2 часов</option>
        <option value="155">до 2,5 часов</option>
      </select>
      <select id="fm">
        <option value="">Любой рейтинг</option>
        <option value="7">от 7</option>
        <option value="7.5">от 7,5</option>
        <option value="8">от 8</option>
      </select>
      <button class="main" id="pickBtn">Что посмотреть сегодня?</button>
    </div>
    <div id="pick" hidden></div>
    <div class="grid" id="list"></div>
  </div>

  <div id="searchView" hidden>
    <div class="bar">
      <input id="q" placeholder="Название фильма" style="flex:1;min-width:200px">
      <button class="main" id="qBtn">Искать</button>
    </div>
    <div class="grid" id="found"></div>
  </div>

  <footer>Данные о фильмах: TMDB. Этот сайт не связан с TMDB и не одобрен им.</footer>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Вставьте свои ключи ===== */
const SUPABASE_URL = "https://qthdglmqonzmpiwrqjhr.supabase.co";
const SUPABASE_KEY = "sb_publishable_HejCyEo-h39wfHXEjcrzXA_m4JHNuBq";
const TMDB_KEY = "5646152e8fba735a975c49162c0d2a88";
/* ================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IMG = "https://image.tmdb.org/t/p/w342";
let movies = [], found = [], tab = "watchlist";

/* ---------- вход ---------- */
async function authGo(kind) {
  const email = $("#em").value.trim(), password = $("#pw").value;
  const { error } = kind === "in"
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  $("#msg").textContent = error ? error.message
    : (kind === "up" ? "Готово. Если сайт просит подтвердить почту, подтвердите её и войдите." : "");
}
function showSession(s) {
  $("#auth").hidden = !!s;
  $("#app").hidden = !s;
  if (s) load();
}
sb.auth.getSession().then(({ data }) => showSession(data.session));
sb.auth.onAuthStateChange((_, s) => showSession(s));

/* ---------- данные ---------- */
async function load() {
  const { data, error } = await sb.from("movies").select("*").order("created_at", { ascending: false });
  if (error) return alert("Ошибка загрузки: " + error.message);
  movies = data;
  render();
}

function filtered() {
  const g = $("#fg").value, rt = +$("#fr").value || 9999, mr = +$("#fm").value || 0;
  return movies.filter(m => m.status === tab
    && (!g || (m.genres || "").split(", ").includes(g))
    && (m.runtime || 0) <= rt
    && (m.tmdb_rating || 0) >= mr);
}

function card(m) {
  const img = m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy">` : `<div class="noimg"></div>`;
  const mine = m.status === "watched" ? `<div class="my">${m.my_rating}/10</div>` : "";
  const note = m.note ? `<div class="note">${esc(m.note)}</div>` : "";
  const btns = m.status === "watchlist"
    ? `<button data-a="seen" data-id="${m.id}">Посмотрел</button>`
    : `<button data-a="rate" data-id="${m.id}">Изменить оценку</button>`;
  return `<article class="card">${img}<div class="body">
    <h2>${esc(m.title)}</h2>
    <div class="meta">${esc(m.year)}${m.runtime ? ", " + m.runtime + " мин" : ""}${m.tmdb_rating ? ", TMDB " + m.tmdb_rating : ""}</div>
    <div class="meta">${esc(m.genres)}</div>${mine}${note}
    <div class="acts">${btns}<button data-a="del" data-id="${m.id}">Удалить</button></div>
  </div></article>`;
}

function render() {
  const cur = $("#fg").value;
  const gs = [...new Set(movies.flatMap(m => (m.genres || "").split(", ").filter(Boolean)))].sort();
  $("#fg").innerHTML = `<option value="">Любой жанр</option>` +
    gs.map(x => `<option ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");
  const l = filtered();
  $("#list").innerHTML = l.length ? l.map(card).join("")
    : `<div class="empty">Здесь пусто. Откройте «Найти фильм» и добавьте первый.</div>`;
}

/* ---------- вкладки и фильтры ---------- */
$("#tabs").onclick = e => {
  const t = e.target.dataset.t; if (!t) return;
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("#listView").hidden = t === "search";
  $("#searchView").hidden = t !== "search";
  $("#pick").hidden = true;
  if (t !== "search") render();
};
["#fg", "#fr", "#fm"].forEach(s => $(s).onchange = render);

$("#pickBtn").onclick = () => {
  const prev = tab; tab = "watchlist";
  const l = filtered(); tab = prev;
  const p = $("#pick");
  p.hidden = false;
  if (tab !== "watchlist") { p.innerHTML = "Выбор делается из списка «Хочу посмотреть»."; return; }
  if (!l.length) { p.innerHTML = "Нет подходящих фильмов. Измените фильтры или добавьте новые."; return; }
  const m = l[Math.floor(Math.random() * l.length)];
  p.innerHTML = `<h2>${esc(m.title)} (${esc(m.year)})</h2><div class="meta">${m.runtime ? m.runtime + " мин, " : ""}${esc(m.genres)}</div>`;
};

/* ---------- действия над карточками ---------- */
$("#list").onclick = async e => {
  const a = e.target.dataset.a, id = +e.target.dataset.id; if (!a) return;
  const m = movies.find(x => x.id === id); if (!m) return;
  if (a === "del") {
    if (!confirm("Удалить «" + m.title + "»?")) return;
    const { error } = await sb.from("movies").delete().eq("id", id);
    if (error) return alert(error.message);
  } else {
    const r = askRating(m.my_rating); if (r === null) return;
    const note = prompt("Заметка (можно оставить пустой)", m.note || "");
    const { error } = await sb.from("movies").update({ status: "watched", my_rating: r, note: note || null }).eq("id", id);
    if (error) return alert(error.message);
  }
  load();
};

function askRating(def) {
  const v = prompt("Ваша оценка от 1 до 10", def || "");
  if (v === null) return null;
  const n = Math.round(+String(v).replace(",", "."));
  if (!(n >= 1 && n <= 10)) { alert("Введите число от 1 до 10."); return null; }
  return n;
}

/* ---------- поиск через TMDB ---------- */
async function doSearch() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#found").innerHTML = `<div class="empty">Ищу…</div>`;
  try {
    const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=ru-RU&query=${encodeURIComponent(q)}`);
    const j = await r.json();
    found = (j.results || []).slice(0, 12);
  } catch (err) {
    $("#found").innerHTML = `<div class="empty">Не удалось связаться с TMDB. Проверьте ключ и доступ к сайту.</div>`;
    return;
  }
  $("#found").innerHTML = found.length ? found.map(f => {
    const have = movies.find(m => m.tmdb_id === f.id);
    const img = f.poster_path ? `<img src="${IMG}${f.poster_path}" alt="" loading="lazy">` : `<div class="noimg"></div>`;
    return `<article class="card">${img}<div class="body">
      <h2>${esc(f.title)}</h2>
      <div class="meta">${esc((f.release_date || "").slice(0, 4))}${f.vote_average ? ", TMDB " + f.vote_average.toFixed(1) : ""}</div>
      <div class="meta">${esc((f.overview || "").slice(0, 110))}${(f.overview || "").length > 110 ? "…" : ""}</div>
      <div class="acts">${have ? `<span class="meta">Уже в списке</span>` :
        `<button data-s="watchlist" data-id="${f.id}">Хочу посмотреть</button><button data-s="watched" data-id="${f.id}">Уже смотрел</button>`}</div>
    </div></article>`;
  }).join("") : `<div class="empty">Ничего не найдено.</div>`;
}
$("#qBtn").onclick = doSearch;
$("#q").onkeydown = e => { if (e.key === "Enter") doSearch(); };

$("#found").onclick = async e => {
  const status = e.target.dataset.s, tid = +e.target.dataset.id; if (!status) return;
  let my = null, note = null;
  if (status === "watched") {
    my = askRating(); if (my === null) return;
    note = prompt("Заметка (можно оставить пустой)") || null;
  }
  let d;
  try {
    d = await (await fetch(`https://api.themoviedb.org/3/movie/${tid}?api_key=${TMDB_KEY}&language=ru-RU`)).json();
  } catch (err) { return alert("Не удалось получить данные о фильме."); }
  const row = {
    tmdb_id: tid, title: d.title, year: (d.release_date || "").slice(0, 4), poster: d.poster_path,
    tmdb_rating: d.vote_average ? +d.vote_average.toFixed(1) : null, runtime: d.runtime || null,
    genres: (d.genres || []).map(x => x.name).join(", "), status, my_rating: my, note
  };
  const { error } = await sb.from("movies").upsert(row, { onConflict: "user_id,tmdb_id" });
  if (error) return alert(error.message);
  await load(); doSearch();
};
</script>
</body>
</html>
