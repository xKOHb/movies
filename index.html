<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск кадров</title>
<meta name="description" content="Личный список фильмов: что посмотреть и что уже смотрел, с оценками и заметками.">
<meta name="theme-color" content="#1c1511">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23e0a867%22/%3E%3Cpath d=%22M18 26v-8h8M38 18h8v8M46 38v8h-8M26 46h-8v-8%22 fill=%22none%22 stroke=%22%232b1a0b%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%224.5%22 fill=%22%232b1a0b%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Картинка для ссылки-приглашения: замените USERNAME и REPO на свои (адрес вашего сайта на GitHub Pages) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Поиск кадров">
<meta property="og:description" content="Личный список фильмов: что посмотреть и что уже смотрел.">
<meta property="og:image" content="https://USERNAME.github.io/REPO/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://USERNAME.github.io/REPO/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1511;--paper:#271d17;--mut:#a89580;--line:#3b2d23;--tx:#f4e9d8;--field:#221914;--glass:#f4e9d810;--acc:#e0a867;--on-acc:#2b1a0b}
[data-theme=light]{--bg:#f5ebdb;--paper:#fffaf0;--mut:#8c7560;--line:#e6d6bd;--tx:#3a291d;--field:#fffaf0;--glass:#3a291d0a;--acc:#b9732f;--on-acc:#fff7ea}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 480px at 12% -8%,color-mix(in srgb,var(--acc) 13%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;margin:0}
main{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
button,select,input,textarea{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--tx);padding:9px 14px;transition:border-color .15s,background .15s,opacity .15s,transform .1s}
button{cursor:pointer}
button:hover{border-color:var(--mut)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed}
button.main{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:600}
button.main:hover:not(:disabled){opacity:.88;border-color:var(--acc)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mut)}
::placeholder{color:var(--mut)}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

.logo b{display:block;font-weight:800;font-size:1.15rem;letter-spacing:.32em;text-transform:uppercase}

.me{position:relative}
#meBtn{width:40px;height:40px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass)}
#meBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#meMenu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 40px #0009;z-index:30}
#meMenu .mail{padding:8px 12px 10px;color:var(--mut);font-size:.82rem;border-bottom:1px solid var(--line);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#meMenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px}
#meMenu button:hover{background:var(--glass)}
#meMenu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.top{position:sticky;top:0;z-index:10;margin:0 -20px 18px;padding:14px 20px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mut);padding:10px 14px;font-weight:600;white-space:nowrap}
.tabs button:hover{color:var(--tx);border-bottom-color:var(--line)}
.tabs button.on{color:var(--tx);border-bottom-color:var(--tx)}
.cnt{margin-left:6px;font-size:.8rem;font-weight:500;color:var(--mut)}
.tabs .on .cnt{color:var(--tx)}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border-radius:999px;padding:5px 14px;font-size:.85rem;color:var(--mut);background:none}
.chips button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}

.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.posters.rows{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.tile{position:relative;display:block;width:100%;padding:0;aspect-ratio:2/3;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:8px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.tile:hover,.tile:focus-visible{transform:scale(1.04);z-index:3;border-color:var(--mut);box-shadow:0 14px 34px #000a}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .noimg{width:100%;height:100%;padding:10px;font-size:.9rem}
.tile .ov{position:absolute;inset:auto 0 0;padding:34px 10px 10px;background:linear-gradient(transparent,#000e);color:#fff;font-size:.82rem;font-weight:600;text-align:left;opacity:0;transition:opacity .15s}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.tile .ov i{opacity:.7;font-style:normal;font-weight:400}
.tile .bd{position:absolute;top:7px;right:7px;font-size:.75rem}
.tile .bd>*{background:#000c;color:#fff;padding:2px 7px;border-radius:5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--mut)}
.card img,.noimg{width:92px;min-height:138px;object-fit:cover;flex:none;background:var(--field);color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center}
.card .body{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card h2{font-size:1rem;line-height:1.25}
.card img,.card h2{cursor:pointer}
.rows .card{cursor:pointer}
.meta{color:var(--mut);font-size:.85rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.card .acts button{padding:5px 11px;font-size:.85rem}
.empty{color:var(--mut);padding:60px 0;text-align:center;grid-column:1/-1}

#auth{max-width:360px;margin:14vh auto;display:grid;gap:12px}
#auth .logo{text-align:center;margin-bottom:14px}
#auth .logo b{font-size:1.7rem}
#auth input,#auth button{width:100%}
#msg{color:var(--mut);min-height:1.2em;font-size:.9rem}

#pick{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
#pick h2{font-size:1.1rem}
.pk{display:flex;gap:14px;align-items:flex-start}.pk img{width:80px;border-radius:6px;flex:none}
footer{margin-top:40px;color:var(--mut);font-size:.78rem}
.hint{color:var(--mut);margin:0 0 14px}
.prof{padding-left:18px;max-width:70ch}.prof li{margin:6px 0}
#profileView h2{margin:22px 0 8px;font-size:1.15rem}

dialog{background:var(--paper);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(460px,92vw);box-shadow:0 30px 80px #000a}
dialog::backdrop{background:#000c;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog textarea{width:100%}
dialog .acts{margin-top:12px;justify-content:flex-end}
dialog h2{text-align:center;font-size:1.1rem}
.nums{display:flex;justify-content:center;gap:2px;margin:16px 0 4px}
.nums button{border:0;background:none;padding:0;width:36px;height:40px;font-size:1.9rem;line-height:1;color:var(--line);transition:transform .12s,color .12s}
.nums button:hover{transform:scale(1.15)}
.nums button.on{color:var(--tx)}
.dval{text-align:center;min-height:3.4em;margin-bottom:10px}
.dval b{font-size:2rem;font-weight:800}
.dval b small{font-size:.9rem;color:var(--mut);font-weight:400}
.dval span{display:block;color:var(--mut);font-size:.9rem;margin-top:2px}

#mv{width:min(900px,96vw);max-height:92vh;overflow:auto;padding:0;border-radius:16px}
#mv .x{position:absolute;top:10px;right:10px;z-index:2;padding:0 11px;font-size:1.4rem;background:#000a;border-color:#ffffff22;color:#fff}
.bk{height:190px;background-size:cover;background-position:center 20%;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.pv{display:flex;gap:22px;padding:0 22px 18px;margin-top:-70px;position:relative}
.pv>img{width:200px;height:300px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.pv h2{font-size:1.6rem;line-height:1.2}.pv p{margin:8px 0;max-width:62ch}
.tag{color:var(--mut);font-style:italic}
.mine{margin:8px 0}.star{font-weight:700}
#tr iframe{width:100%;aspect-ratio:16/9;border:0;margin-top:12px;border-radius:8px}
#mv h3{padding:0 22px;font-size:1.05rem;margin:6px 0 10px}
.sim{display:flex;gap:10px;overflow-x:auto;padding:8px 22px 22px}.sim .tile{width:110px;flex:none}
.sim .tile:hover,.sim .tile:focus-visible{transform:scale(1.03)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);padding:11px 18px;border-radius:10px;box-shadow:0 8px 28px #0008;z-index:99}

@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.anim .tile,.anim .card{animation:rise .4s ease backwards;animation-delay:min(calc(var(--i,0)*30ms),450ms)}
@keyframes shimmer{to{background-position:-200% 0}}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--paper) 25%,var(--line) 50%,var(--paper) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk.p{aspect-ratio:2/3}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
@media(max-width:640px){.pv{flex-direction:column;margin-top:-30px}.pv>img{width:140px;height:210px}}

/* ===== тёплый уют ===== */
button,select,input,textarea{border-radius:12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
:focus-visible{outline-color:var(--acc)}
button.main{border-radius:999px;padding:9px 20px;box-shadow:0 4px 16px color-mix(in srgb,var(--acc) 28%,transparent)}
button:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:1.3rem;letter-spacing:-.01em;text-transform:none;font-weight:800}
.mk{width:30px;height:30px;flex:none}
.mk rect{fill:var(--acc)}.mk path{fill:none;stroke:var(--on-acc);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.mk circle{fill:var(--on-acc)}
#auth .logo{justify-content:center}#auth .logo b{font-size:1.9rem}#auth .logo .mk{width:40px;height:40px}
.tag2{text-align:center;color:var(--mut);margin:-6px 0 6px}
#meBtn{background-size:cover;background-position:center;overflow:hidden;border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
#meMenu{border-radius:16px}
.top{padding:14px 20px 4px}
.tabs{width:max-content;max-width:100%;background:var(--glass);border:1px solid var(--line);padding:4px;border-radius:999px;margin-bottom:12px}
.tabs button{border:0;border-radius:999px;padding:8px 16px}
.tabs button:hover{color:var(--tx);background:var(--glass);border-bottom-color:transparent}
.tabs button.on{background:var(--acc);color:var(--on-acc)}
.tabs .on .cnt{color:inherit;opacity:.75}
.tile{border-radius:14px}.card{border-radius:16px}#pick{border-radius:18px}
.tile .bd b{color:#f3c98b}.star{color:var(--acc)}
.empty{padding:70px 0}
dialog{border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 9%,var(--paper)),var(--paper) 140px)}
dialog input{width:100%}
.lbl{display:block;color:var(--mut);font-size:.85rem;margin:14px 0 4px}
.nums button{color:color-mix(in srgb,var(--mut) 35%,transparent)}
.nums button.on{color:var(--acc);text-shadow:0 0 18px color-mix(in srgb,var(--acc) 45%,transparent)}
.dval b{color:var(--acc);font-size:2.4rem}
#mv{border-radius:24px}.pv>img{border-radius:14px;box-shadow:0 16px 40px #0008}
.pv h2{font-size:1.7rem}

/* профиль */
.pf-banner{height:210px;border-radius:22px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 50%,var(--paper)),color-mix(in srgb,var(--acc) 8%,var(--paper))) center/cover}
.pf-banner button{position:absolute;right:12px;top:12px;background:#000a;color:#fff;border-color:#ffffff30;padding:6px 14px;font-size:.85rem;border-radius:999px}
.pf-head{display:flex;gap:18px;align-items:flex-end;padding:0 22px;margin-top:-54px;position:relative;flex-wrap:wrap}
.pf-av{width:112px;height:112px;padding:0;border-radius:50%;border:4px solid var(--bg);background:var(--paper) center/cover;font-size:2.6rem;font-weight:800;color:var(--acc);position:relative;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.pf-av span{position:absolute;inset:auto 0 0;background:#000b;color:#fff;font-size:.7rem;font-weight:600;padding:5px 0;opacity:0;transition:opacity .15s}
.pf-av:hover span,.pf-av:focus-visible span{opacity:1}
.pf-name{flex:1;min-width:200px;padding-bottom:6px}.pf-name h2{font-size:1.6rem}
.pf-bio{margin:14px 0 0;max-width:68ch;color:var(--tx)}
.pf-bio.none{color:var(--mut)}
.chip2{display:inline-block;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:.85rem;margin:8px 6px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-size:1.8rem;font-weight:800;color:var(--acc);line-height:1.2}.stat span{color:var(--mut);font-size:.85rem}
.pf-sec{margin-top:28px}.pf-sec h3{font-size:1.1rem;margin:0 0 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}
.panel h3{margin-bottom:14px}
.hist{display:flex;align-items:flex-end;gap:6px;height:130px}
.hist div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;color:var(--mut);font-size:.72rem}
.hist i{display:block;width:100%;background:var(--acc);border-radius:7px 7px 2px 2px;min-height:3px;opacity:.9}
.hist small{font-size:.78rem}
.gb{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
.gb i{display:block;height:10px;border-radius:99px;background:var(--acc);min-width:6px}
.gb span:last-child{color:var(--mut);text-align:right}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
details.taste{margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:6px 18px}
details.taste summary{cursor:pointer;padding:12px 0;font-weight:700}
details.taste .main{margin:6px 0 16px}
</style>
</head>
<body>
<main>

<section id="auth" hidden>
  <div class="logo"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16"/><path d="M18 26v-8h8M38 18h8v8M46 38v8h-8M26 46h-8v-8"/><circle cx="32" cy="32" r="4.5"/></svg><b>Поиск кадров</b></div>
  <p class="tag2">Личный список фильмов</p>
  <input id="em" type="email" placeholder="Эл. почта" autocomplete="email">
  <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <button class="main" onclick="authGo('in')">Войти</button>
  <button onclick="authGo('up')">Зарегистрироваться</button>
  <div id="msg"></div>
</section>

<section id="app" hidden>
  <div class="top">
  <header>
    <div class="logo"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16"/><path d="M18 26v-8h8M38 18h8v8M46 38v8h-8M26 46h-8v-8"/><circle cx="32" cy="32" r="4.5"/></svg><b>Поиск кадров</b></div>
    <div class="me">
      <button id="meBtn" aria-label="Профиль" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
      <div id="meMenu" hidden>
        <div class="mail" id="meMail"></div>
        <button data-m="profile">Мой профиль</button>
        <button data-m="view" id="mView"></button>
        <button data-m="theme" id="mTheme"></button>
        <hr>
        <button data-m="out">Выйти</button>
      </div>
    </div>
  </header>
  <div class="tabs" id="tabs">
    <button data-t="watchlist" class="on">Хочу посмотреть</button>
    <button data-t="watched">Просмотрено</button>
    <button data-t="picks">Подборка</button>
    <button data-t="search">Найти фильм</button>
  </div>
  </div>

  <div id="listView">
    <div class="chips" id="chips"></div>
    <div class="bar">
      <input id="fq" placeholder="Поиск по моему списку" style="flex:1;min-width:180px">
      <select id="fg" hidden></select>
      <select id="fr">
        <option value="">Любая длительность</option>
        <option value="95">до 95 минут</option>
        <option value="125">до 2 часов</option>
        <option value="155">до 2,5 часов</option>
      </select>
      <select id="fm">
        <option value="">Любой рейтинг</option>
        <option value="7">от 7</option>
        <option value="7.5">от 7,5</option>
        <option value="8">от 8</option>
      </select>
      <select id="fs"><option value="new">Сначала новые</option><option value="my">По моей оценке</option><option value="tm">По рейтингу TMDB</option><option value="yr">По году</option><option value="rt">По длительности</option></select>
      <button class="main" id="pickBtn">Что посмотреть сегодня?</button>
    </div>
    <div id="pick" hidden></div>
    <div class="posters" id="list"></div>
  </div>

  <div id="searchView" hidden>
    <div class="bar">
      <input id="q" placeholder="Название фильма" style="flex:1;min-width:200px">
      <button class="main" id="qBtn">Искать</button>
    </div>
    <div class="grid" id="found"></div>
  </div>

  <div id="picksView" hidden></div>
  <div id="profileView" hidden></div>
  <dialog id="dlg"><form method="dialog"><h2 id="dTitle"></h2><div class="nums" id="dNums"></div><div class="dval" id="dVal"></div><textarea id="dNote" rows="3" placeholder="Заметка (необязательно)"></textarea><div class="acts"><button value="no">Отмена</button><button class="main" id="dOk" value="ok">Сохранить</button></div></form></dialog>
  <dialog id="mv"><button class="x" id="mvX" aria-label="Закрыть">×</button><div id="mvBody"></div></dialog>
  <dialog id="pfDlg"><form method="dialog"><h2>О себе</h2><label class="lbl" for="pfName">Имя</label><input id="pfName" maxlength="40" placeholder="Как вас называть"><label class="lbl" for="pfBio">Обо мне</label><textarea id="pfBio" rows="4" maxlength="400" placeholder="Пара слов о том, какое кино вы любите" style="width:100%"></textarea><div class="acts"><button value="no">Отмена</button><button class="main" value="ok">Сохранить</button></div></form></dialog>
  <div id="toast" hidden></div>
  <footer>Данные о фильмах: TMDB. Этот сайт не связан с TMDB и не одобрен им.</footer>
</section>

</main>

<script>

const TMDB_KEY = "5646152e8fba735a975c49162c0d2a88";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let movies = [], found = [], tab = "watchlist";
let animNext = false, view = "grid", userEmail = "", userId = "", profile = {};

const skel = n => Array.from({ length: n }, () => `<div class="sk p"></div>`).join("");

/* ---------- вход ---------- */
async function authGo(kind) {
  const email = $("#em").value.trim(), password = $("#pw").value;
  const { error } = kind === "in"
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  $("#msg").textContent = error ? error.message
    : (kind === "up" ? "Готово. Если сайт просит подтвердить почту, подтвердите её и войдите." : "");
}
function showSession(s) {
  $("#auth").hidden = !!s;
  $("#app").hidden = !s;
  userEmail = (s && s.user && s.user.email) || "";
  if (s) { userId = s.user.id; animNext = true; load(); loadProfile(); } else { profile = {}; userId = ""; }
}
sb.auth.getSession().then(({ data }) => showSession(data.session));
sb.auth.onAuthStateChange((_, s) => showSession(s));

/* ---------- данные ---------- */
async function load() {
  if (!movies.length) $("#list").innerHTML = skel(12);
  const { data, error } = await sb.from("movies").select("*").order("created_at", { ascending: false });
  if (error) return alert("Ошибка загрузки: " + error.message);
  movies = data;
  render();
}

function filtered() {
  const g = $("#fg").value, rt = +$("#fr").value || 9999, mr = +$("#fm").value || 0;
  const q = ($("#fq").value || "").trim().toLowerCase();
  return movies.filter(m => m.status === tab
    && (!q || (m.title || "").toLowerCase().includes(q))
    && (!g || (m.genres || "").split(", ").includes(g))
    && (m.runtime || 0) <= rt
    && (m.tmdb_rating || 0) >= mr).sort(SORTS[$("#fs").value] || SORTS.new);
}

function row(m, i) {
  const img = m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="" loading="lazy">` : `<div class="noimg"></div>`;
  const info = [m.runtime ? m.runtime + " мин" : "", esc(m.genres)].filter(Boolean).join(", ");
  return `<article class="card" data-tid="${m.tmdb_id}" style="--i:${i}">${img}<div class="body">
    <h2>${esc(m.title)} <span class="meta">${esc(m.year)}</span></h2>
    <div class="meta">${info}</div>
    <div class="meta">${m.tmdb_rating ? "TMDB " + m.tmdb_rating : ""}</div>
    ${m.status === "watched" ? `<b class="star">★ ${m.my_rating}/10</b>` : ""}
    ${m.note ? `<div class="meta"><i>${esc(m.note.slice(0, 140))}</i></div>` : ""}
  </div></article>`;
}
function tile(m, i) {
  const img = m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="${esc(m.title)}" loading="lazy">` : `<div class="noimg">${esc(m.title)}</div>`;
  const badge = m.status === "watched" ? `<b>★ ${m.my_rating}</b>` : (m.tmdb_rating ? `<span>${m.tmdb_rating}</span>` : "");
  return `<button class="tile" data-tid="${m.tmdb_id}" style="--i:${i}" title="${esc(m.title)}">${img}<span class="ov">${esc(m.title)} <i>${esc(m.year)}</i></span><span class="bd">${badge}</span></button>`;
}

function render() {
  const L = { watchlist: "Хочу посмотреть", watched: "Просмотрено" };
  for (const k in L) document.querySelector(`#tabs [data-t=${k}]`).innerHTML = `${L[k]} <span class="cnt">${movies.filter(m => m.status === k).length}</span>`;
  if (tab === "picks") return renderPicks();
  if (tab === "profile") return renderProfile();
  if (tab === "search") return;
  const cur = $("#fg").value;
  const gs = [...new Set(movies.filter(m => m.status === tab).flatMap(m => (m.genres || "").split(", ").filter(Boolean)))].sort();
  $("#fg").innerHTML = `<option value="">Любой жанр</option>` +
    gs.map(x => `<option ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");
  const g = $("#fg").value;
  $("#chips").innerHTML = [""].concat(gs).map(x => `<button class="${x === g ? "on" : ""}" data-g="${esc(x)}">${x ? esc(x) : "Все жанры"}</button>`).join("");
  $("#pickBtn").hidden = tab !== "watchlist";
  const l = filtered(), box = $("#list");
  box.className = "posters" + (view === "rows" ? " rows" : "") + (animNext ? " anim" : "");
  animNext = false;
  box.innerHTML = l.length ? l.map((m, i) => view === "rows" ? row(m, i) : tile(m, i)).join("")
    : `<div class="empty">${movies.some(m => m.status === tab) ? "Ничего не найдено. Измените фильтры." : "Здесь пусто. Откройте «Найти фильм» и добавьте первый."}</div>`;
}

/* ---------- вкладки и фильтры ---------- */
const VIEWS = { watchlist: "listView", watched: "listView", search: "searchView", picks: "picksView", profile: "profileView" };
function go(t) {
  tab = t; animNext = true;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  for (const v of new Set(Object.values(VIEWS))) $("#" + v).hidden = VIEWS[t] !== v;
  $("#pick").hidden = true;
  render();
}
$("#tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (b) go(b.dataset.t); };
["#fg", "#fr", "#fm", "#fs"].forEach(s => $(s).onchange = render);
$("#fq").oninput = render;
$("#chips").onclick = e => { const b = e.target.closest("[data-g]"); if (!b) return; $("#fg").value = b.dataset.g; render(); };
function toggleView() {
  view = view === "rows" ? "grid" : "rows";
  try { localStorage.setItem("vw", view); } catch (e) {}
  animNext = true; syncMenu(); render();
}

let lastPick = null;
function pickOne() {
  const p = $("#pick"); p.hidden = false;
  let l = filtered();
  if (!l.length) { p.innerHTML = "Нет подходящих фильмов. Измените фильтры или добавьте новые."; return; }
  if (l.length > 1) l = l.filter(m => m.tmdb_id !== lastPick);
  const m = l[Math.floor(Math.random() * l.length)]; lastPick = m.tmdb_id;
  const img = m.poster ? `<img src="${IMG}${esc(m.poster)}" alt="">` : "";
  p.innerHTML = `<div class="pk">${img}<div><h2>${esc(m.title)} (${esc(m.year)})</h2><div class="meta">${m.runtime ? m.runtime + " мин, " : ""}${esc(m.genres)}${m.tmdb_rating ? ", TMDB " + m.tmdb_rating : ""}</div><p class="acts" style="margin-top:12px"><button class="main" data-tid="${m.tmdb_id}">Открыть страницу фильма</button><button data-again="1">Другой вариант</button></p></div></div>`;
}
$("#pickBtn").onclick = pickOne;

/* ---------- действия над карточками ---------- */
$("#list").onclick = e => { const t = e.target.closest("[data-tid]"); if (t) openMovie(+t.dataset.tid); };

function askRating(def) {
  const v = prompt("Ваша оценка от 1 до 10", def || "");
  if (v === null) return null;
  const n = Math.round(+String(v).replace(",", "."));
  if (!(n >= 1 && n <= 10)) { alert("Введите число от 1 до 10."); return null; }
  return n;
}

/* ---------- поиск через TMDB ---------- */
async function doSearch() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#found").innerHTML = Array.from({ length: 6 }, () => `<div class="sk" style="height:138px"></div>`).join("");
  try {
    const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=ru-RU&query=${encodeURIComponent(q)}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.status_message || "HTTP " + r.status);
    found = (j.results || []).slice(0, 12);
  } catch (err) {
    $("#found").innerHTML = `<div class="empty">Не удалось получить ответ от TMDB (${esc(err.message)}). Проверьте VPN, блокировщики рекламы и ключ.</div>`;
    return;
  }
  $("#found").innerHTML = found.length ? found.map(f => {
    const have = movies.find(m => m.tmdb_id === f.id);
    const img = f.poster_path ? `<img src="${IMG}${f.poster_path}" alt="" loading="lazy">` : `<div class="noimg"></div>`;
    return `<article class="card" data-tid="${f.id}">${img}<div class="body">
      <h2>${esc(f.title)}</h2>
      <div class="meta">${esc((f.release_date || "").slice(0, 4))}${f.vote_average ? ", TMDB " + f.vote_average.toFixed(1) : ""}</div>
      <div class="meta">${esc((f.overview || "").slice(0, 110))}${(f.overview || "").length > 110 ? "…" : ""}</div>
      <div class="acts">${have ? `<span class="meta">Уже в списке</span>` :
        `<button data-s="watchlist" data-id="${f.id}">Хочу посмотреть</button><button data-s="watched" data-id="${f.id}">Уже смотрел</button>`}</div>
    </div></article>`;
  }).join("") : `<div class="empty">Ничего не найдено.</div>`;
}
$("#qBtn").onclick = doSearch;
$("#q").onkeydown = e => { if (e.key === "Enter") doSearch(); };

async function addMovie(tid, status) {
  let my = null, note = null;
  if (status === "watched") {
    const r = await rateDialog("Ваша оценка"); if (!r) return false;
    my = r.rating; note = r.note;
  }
  let d;
  try { d = await (await fetch(`https://api.themoviedb.org/3/movie/${tid}?api_key=${TMDB_KEY}&language=ru-RU`)).json(); }
  catch (err) { toast("Не удалось получить данные о фильме."); return false; }
  const row = {
    tmdb_id: tid, title: d.title, year: (d.release_date || "").slice(0, 4), poster: d.poster_path,
    tmdb_rating: d.vote_average ? +d.vote_average.toFixed(1) : null, runtime: d.runtime || null,
    genres: (d.genres || []).map(x => x.name).join(", "), status, my_rating: my, note
  };
  const { error } = await sb.from("movies").upsert(row, { onConflict: "user_id,tmdb_id" });
  if (error) { toast(error.message); return false; }
  await load(); toast("Добавлено: " + d.title); return true;
}
$("#found").onclick = async e => { const c = e.target.closest("[data-tid]"); if (c && e.target.closest("img,h2")) return openMovie(+c.dataset.tid); const s = e.target.dataset.s; if (s && await addMovie(+e.target.dataset.id, s)) doSearch(); };

function rateDialog(title, rating, note) {
  return new Promise(res => {
    const d = $("#dlg"), nums = $("#dNums"); let val = rating || 0;
    $("#dTitle").textContent = title; $("#dNote").value = note || "";
    const LBL = ["", "Ужас", "Очень плохо", "Плохо", "Слабо", "Нормально", "Неплохо", "Хорошо", "Очень хорошо", "Отлично", "Шедевр"];
    nums.innerHTML = Array.from({ length: 10 }, (_, i) => `<button type="button" data-v="${i + 1}" aria-label="${i + 1}">★</button>`).join("");
    const paint = h => {
      const x = h || val;
      nums.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.v <= x));
      $("#dVal").innerHTML = x ? `<b>${x}<small> / 10</small></b><span>${LBL[x]}</span>` : `<span>Выберите оценку</span>`;
      $("#dOk").disabled = !val;
    };
    nums.onmouseover = e => { const b = e.target.closest("[data-v]"); if (b) paint(+b.dataset.v); };
    nums.onmouseleave = () => paint();
    nums.onclick = e => { const b = e.target.closest("[data-v]"); if (b) { val = +b.dataset.v; paint(); } };
    paint();
    d.onclose = () => res(d.returnValue === "ok" && val ? { rating: val, note: $("#dNote").value.trim() || null } : null);
    d.returnValue = ""; d.showModal();
  });
}
function toast(t) { const x = $("#toast"); x.textContent = t; x.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => x.hidden = true, 2600); }

const SORTS = {
  new: () => 0,
  my: (a, b) => (b.my_rating || 0) - (a.my_rating || 0),
  tm: (a, b) => (b.tmdb_rating || 0) - (a.tmdb_rating || 0),
  yr: (a, b) => (+b.year || 0) - (+a.year || 0),
  rt: (a, b) => (a.runtime || 999) - (b.runtime || 999)
};

/* ---------- подборка ---------- */
const PICKS = [["Начало",2010,"Воры проникают в сны, чтобы внедрить идею"],["Мементо",2000,"Герой без кратковременной памяти ищет убийцу"],["Семь",1995,"Два детектива и серийный убийца"],["Престиж",2006,"Дуэль двух фокусников"],["Подозрительные лица",1995,"Эталонный детективный твист"],["Заключённые",2013,"Отец ищет похищенную дочь"],["Исчезнувшая",2014,"Жена пропала, муж под подозрением"],["Отступники",2006,"Полицейский в банде и бандит в полиции"],["Шестое чувство",1999,"Психолог и мальчик, который видит призраков"],["Прибытие",2016,"Контакт с пришельцами и загадка языка"],["12 обезьян",1995,"Путешествие во времени и смертельный вирус"],["Из машины",2014,"Тест на сознание робота"],["Чёрный лебедь",2010,"Балерина на грани безумия"],["Машинист",2004,"Бессонница и странные знаки"],["Идентификация",2003,"Десять незнакомцев в мотеле во время бури"]];
const picked = new Set();
function renderPicks() {
  $("#picksView").innerHTML = `<p class="hint">Подборка под ваш вкус. Нажмите «Хочу посмотреть»: фильм найдётся в TMDB и попадёт в список.</p><div class="grid">` +

$("#picksView").onclick = async e => {

    if (!(j.results || []).length) j = await q("");
    const f = (j.results || [])[0];
    if (!f) { toast("Не нашёл «" + t + "» в TMDB."); renderPicks(); return; }

/* --- данные профиля (имя, «обо мне», аватар, баннер) --- */
async function loadProfile() {
  const { data } = await sb.from("profiles").select("*").eq("user_id", userId).maybeSingle();
  profile = data || {}; syncMenu(); if (tab === "profile") renderProfile();
}
async function saveProfile(patch) {
  const row = { user_id: userId, display_name: profile.display_name || null, bio: profile.bio || null,
    avatar_url: profile.avatar_url || null, banner_url: profile.banner_url || null, ...patch, updated_at: new Date().toISOString() };
  const { error } = await sb.from("profiles").upsert(row, { onConflict: "user_id" });
  if (error) { toast("Не сохранилось: " + error.message + ". Выполнили SQL из migration_profile.sql?"); return false; }
  profile = row; syncMenu(); return true;
}
async function toJpeg(file, w, h) {
  const bmp = await createImageBitmap(file);
  const k = Math.max(w / bmp.width, h / bmp.height), dw = bmp.width * k, dh = bmp.height * k;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
  return new Promise(res => c.toBlob(res, "image/jpeg", .86));
}
function pickImage(kind) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; toast("Загружаю…");
    try {
      const blob = await toJpeg(f, kind === "avatar" ? 512 : 1600, kind === "avatar" ? 512 : 480);
      const path = `${userId}/${kind}.jpg`;
      const { error } = await sb.storage.from("profile-media").upload(path, blob, { upsert: true, contentType: "image/jpeg", cacheControl: "3600" });
      if (error) throw error;
      const url = sb.storage.from("profile-media").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
      if (await saveProfile({ [kind + "_url"]: url })) { renderProfile(); toast("Готово"); }
    } catch (e) { toast("Не получилось: " + (e.message || e) + ". Выполнили SQL из migration_profile.sql?"); }
  };
  inp.click();
}
function editProfile() {
  const d = $("#pfDlg"); $("#pfName").value = profile.display_name || ""; $("#pfBio").value = profile.bio || "";
  d.onclose = async () => {
    if (d.returnValue !== "ok") return;
    if (await saveProfile({ display_name: $("#pfName").value.trim() || null, bio: $("#pfBio").value.trim() || null })) renderProfile();
  };
  d.returnValue = ""; d.showModal();
}

function renderProfile() {

  const hist = Array.from({ length: 10 }, (_, i) => r.filter(m => m.my_rating === i + 1).length), hmax = Math.max(1, ...hist);
  const gc = {}; w.forEach(m => (m.genres || "").split(", ").filter(Boolean).forEach(g => gc[g] = (gc[g] || 0) + 1));
  const gl = Object.entries(gc).sort((a, b) => b[1] - a[1]), gmax = gl.length ? gl[0][1] : 1;
  const topF = [...r].sort((a, b) => b.my_rating - a.my_rating).slice(0, 10);
  const recent = w.slice(0, 8);
  const strip = (l, ) => `<div class="strip">${l.map((m, i) => tile(m, i)).join("")}</div>`;
  const bn = profile.banner_url ? `background-image:url('${esc(profile.banner_url)}')` : "";
  const av = profile.avatar_url ? `background-image:url('${esc(profile.avatar_url)}')` : "";
  $("#profileView").innerHTML = `
    <div class="pf-banner" style="${bn}"><button id="pfBn">Сменить баннер</button></div>
    <div class="pf-head">
      <button class="pf-av" id="pfAv" style="${av}" aria-label="Сменить аватар">${profile.avatar_url ? "" : esc(name[0].toUpperCase())}<span>Изменить</span></button>
      <div class="pf-name"><h2>${esc(name)}</h2><div class="meta">${esc(userEmail)}</div></div>
      <button id="pfEdit">Редактировать</button>
    </div>
    <p class="pf-bio ${profile.bio ? "" : "none"}">${profile.bio ? esc(profile.bio) : "Расскажите о себе: нажмите «Редактировать»."}</p>
    ${gl.length ? `<div>${gl.slice(0, 5).map(([g]) => `<span class="chip2">${esc(g)}</span>`).join("")}</div>` : ""}
    <div class="stats">
      <div class="stat"><b>${w.length}</b><span>просмотрено</span></div>
      <div class="stat"><b>${movies.length - w.length}</b><span>хочу посмотреть</span></div>
      <div class="stat"><b>${avg}</b><span>средняя оценка</span></div>
      <div class="stat"><b>${hours}</b><span>часов кино</span></div>
    </div>
    <div class="pf-sec cols">
      <div class="panel"><h3>Мои оценки</h3>${r.length ? `<div class="hist">${hist.map((n, i) => `<div>${n || ""}<i style="height:${Math.round(n / hmax * 100)}%"></i><small>${i + 1}</small></div>`).join("")}</div>` : `<div class="meta">Оцените первый фильм, и здесь появится график.</div>`}</div>
      <div class="panel"><h3>Любимые жанры</h3>${gl.length ? gl.slice(0, 6).map(([g, n]) => `<div class="gb"><span>${esc(g)}</span><i style="width:${Math.round(n / gmax * 100)}%"></i><span>${n}</span></div>`).join("") : `<div class="meta">Пока нет данных.</div>`}</div>
    </div>
    <div class="pf-sec"><h3>Любимые фильмы</h3>${topF.length ? strip(topF) : `<div class="meta">Поставьте оценки, и лучшие фильмы окажутся здесь.</div>`}</div>
    <div class="pf-sec"><h3>Недавно просмотренные</h3>${recent.length ? strip(recent) : `<div class="meta">Пока ничего.</div>`}</div>
    <details class="taste"><summary>Мой вкус и промт для подбора фильмов</summary><ul class="prof">${PROFILE.map(x => `<li>${esc(x)}</li>`).join("")}</ul><button class="main" id="copyPrompt">Скопировать промт для подбора фильмов</button></details>`;
  $("#pfAv").onclick = () => pickImage("avatar");
  $("#pfBn").onclick = () => pickImage("banner");
  $("#pfEdit").onclick = editProfile;
  $("#copyPrompt").onclick = copyPrompt;
}
function copyPrompt() {
  const w = movies.filter(m => m.status === "watched").map(m => `${m.title} (${m.year}) - ${m.my_rating}/10${m.note ? ", " + m.note : ""}`).join("\n") || "пока нет";
  const l = movies.filter(m => m.status === "watchlist").map(m => m.title).join(", ") || "пока нет";
  const t = `Ты опытный кинокритик. Подбери мне фильмы.\n\nМОЙ ВКУС:\n${PROFILE.map(x => "- " + x).join("\n")}\n\nУЖЕ СМОТРЕЛ (с моими оценками):\n${w}\n\nУЖЕ В СПИСКЕ «ХОЧУ ПОСМОТРЕТЬ»: ${l}\n\nЗАДАЧА: предложи 8 фильмов, которых нет в списках выше, с рейтингом IMDb от 7,5. К каждому: год, длительность, 1-2 предложения, почему подойдёт, без спойлеров. Добавь 2 скрытые жемчужины и отметь фильмы для просмотра с друзьями. В конце задай 2 уточняющих вопроса.`;
  navigator.clipboard.writeText(t).then(() => toast("Промт скопирован"), () => toast("Не удалось скопировать"));
}

/* ---------- тема ---------- */
try { document.documentElement.dataset.theme = localStorage.getItem("th") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch (e) {}
function toggleTheme() {
  const r = document.documentElement; r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
  try { localStorage.setItem("th", r.dataset.theme); } catch (e) {}
  syncMenu();
}

/* ---------- меню профиля (иконка человечка) ---------- */
const menu = $("#meMenu");
function syncMenu() {
  $("#meMail").textContent = userEmail;
  $("#mView").textContent = "Вид списка: " + (view === "rows" ? "строки" : "постеры");
  const mb = $("#meBtn"), has = !!profile.avatar_url;
  mb.style.backgroundImage = has ? `url("${profile.avatar_url}")` : ""; mb.querySelector("svg").style.display = has ? "none" : "";
  $("#mTheme").textContent = "Тема: " + (document.documentElement.dataset.theme === "light" ? "светлая" : "тёмная");
}
function closeMenu() { menu.hidden = true; $("#meBtn").setAttribute("aria-expanded", "false"); }
$("#meBtn").onclick = e => {
  e.stopPropagation(); syncMenu(); menu.hidden = !menu.hidden;
  $("#meBtn").setAttribute("aria-expanded", String(!menu.hidden));
};
menu.onclick = e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  const m = b.dataset.m;
  if (m === "view") return toggleView();
  if (m === "theme") return toggleTheme();
  closeMenu();
  if (m === "profile") go("profile"); else if (m === "out") sb.auth.signOut();
};
document.addEventListener("click", e => { if (!menu.hidden && !e.target.closest(".me")) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
syncMenu();

/* ---------- страница фильма ---------- */
$("#mvX").onclick = () => $("#mv").close();
$("#mv").onclick = e => { if (e.target.id === "mv") $("#mv").close(); };
$("#pick").onclick = e => {
  if (e.target.dataset.again) return pickOne();
  const t = e.target.dataset.tid; if (t) openMovie(+t);
};

async function openMovie(tid) {
  const dlg = $("#mv"), body = $("#mvBody");
  if (!dlg.open) dlg.showModal();
  body.innerHTML = `<div style="padding:22px;display:grid;gap:12px"><div class="sk" style="height:190px"></div><div class="sk" style="height:26px;width:50%"></div><div class="sk" style="height:70px"></div></div>`;
  let f;
  try {
    const r = await fetch(`https://api.themoviedb.org/3/movie/${tid}?api_key=${TMDB_KEY}&language=ru-RU&append_to_response=credits,videos,similar&include_video_language=ru,en,null`);
    f = await r.json(); if (!r.ok) throw new Error(f.status_message || r.status);
  } catch (err) { body.innerHTML = `<div class="empty" style="padding:50px 22px">Не удалось загрузить фильм (${esc(err.message)}).</div>`; return; }
  const m = movies.find(x => x.tmdb_id === tid);
  const dir = (f.credits?.crew || []).filter(c => c.job === "Director").map(c => c.name).join(", ");
  const cast = (f.credits?.cast || []).slice(0, 8).map(c => c.name).join(", ");
  const vids = f.videos?.results || [];
  const vid = vids.find(v => v.site === "YouTube" && v.type === "Trailer") || vids.find(v => v.site === "YouTube");
  const sim = (f.similar?.results || []).filter(x => x.poster_path).slice(0, 10);
  const acts = !m ? `<button class="main" data-a="want">Хочу посмотреть</button><button data-a="seen">Уже смотрел</button>`
    : m.status === "watchlist" ? `<button class="main" data-a="seen">Посмотрел, оценить</button><button data-a="del">Убрать из списка</button>`
    : `<button class="main" data-a="seen">Изменить оценку</button><button data-a="del">Удалить</button>`;
  const mine = m && m.status === "watched" ? `<div class="mine"><b class="star">★ ${m.my_rating}/10</b>${m.note ? " " + `<i>${esc(m.note)}</i>` : ""}</div>` : "";
  body.innerHTML = `${f.backdrop_path ? `<div class="bk" style="background-image:url(https://image.tmdb.org/t/p/w780${f.backdrop_path})"></div>` : `<div style="height:60px"></div>`}
    <div class="pv">${f.poster_path ? `<img src="${IMG}${f.poster_path}" alt="">` : ""}<div>
      <h2>${esc(f.title)} <span class="meta">${esc((f.release_date || "").slice(0, 4))}</span></h2>
      <div class="meta">${f.runtime ? f.runtime + " мин" : ""}${f.vote_average ? ", TMDB " + f.vote_average.toFixed(1) : ""}</div>
      <div class="meta">${esc((f.genres || []).map(g => g.name).join(", "))}</div>
      ${f.tagline ? `<p class="tag">${esc(f.tagline)}</p>` : ""}
      <p>${esc(f.overview || "Описания пока нет.")}</p>
      ${dir ? `<p class="meta">Режиссёр: ${esc(dir)}</p>` : ""}${cast ? `<p class="meta">В ролях: ${esc(cast)}</p>` : ""}
      ${mine}<div class="acts" style="margin-top:12px">${acts}${vid ? `<button data-a="tr" data-k="${esc(vid.key)}">Трейлер</button>` : ""}</div>
      <div id="tr"></div></div></div>
    ${sim.length ? `<h3>Похожие фильмы</h3><div class="sim">${sim.map(x => `<button class="tile" data-sim="${x.id}" title="${esc(x.title)}"><img src="${IMG}${x.poster_path}" alt="${esc(x.title)}" loading="lazy"></button>`).join("")}</div>` : ""}`;
  body.onclick = async e => {
    const sm = e.target.closest("[data-sim]"); if (sm) return openMovie(+sm.dataset.sim);
    const a = e.target.dataset.a; if (!a) return;
    if (a === "tr") { $("#tr").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(e.target.dataset.k)}?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`; return; }
    if (a === "want") await addMovie(tid, "watchlist");
    else if (a === "seen" && !m) await addMovie(tid, "watched");
    else if (a === "seen") {
      const r = await rateDialog(f.title, m.my_rating, m.note); if (!r) return;
      const { error } = await sb.from("movies").update({ status: "watched", my_rating: r.rating, note: r.note }).eq("id", m.id);
      if (error) return toast(error.message); await load();
    } else if (a === "del") {
      if (!confirm("Удалить «" + f.title + "» из списка?")) return;
      const { error } = await sb.from("movies").delete().eq("id", m.id);
      if (error) return toast(error.message); await load();
    }
    openMovie(tid);
  };
}
</script>
</body>
</html>
